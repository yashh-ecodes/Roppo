services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roppo
      POSTGRES_USER: roppo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roppo-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roppo"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      ROPPO_DATABASE_URL: postgresql+psycopg://roppo:${POSTGRES_PASSWORD:-roppo-local-only}@db:5432/roppo
      ROPPO_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - uploads:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
